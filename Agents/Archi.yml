# NHAA 14566 AI-Based Real-Time Stress and Trauma Assessment Architecture
Project:
  Name: NHAA-14566-Trauma-Assessment
  Helpline: National Helpline Against Atrocities (14566)
  Target: Real-time trauma detection, risk scoring (0-100%), and crisis intervention

Architecture_Modules:
  Backend:
    Runtime: Node.js + Express + TypeScript + ws (WebSocket)
    Port: 3000
    Compatibility: Linux and Windows cross-platform
    Endpoints:
      - /api/auth/register: Register web user & baseline screening
      - /api/auth/login: Web portal login & profile fetch
      - /api/phone/call: Phone call simulation (14566 IVR entrypoint)
      - /api/phone/identify: Caller ID lookup for registered vs new callers
      - /api/phone/create-profile: Interactive voice profile creation
      - /api/trauma/assess: Direct audio/text trauma & stress evaluation
      - /api/cases: Grievance & incident case logs with risk metrics
      - /api/stats: Aggregate real-time crisis monitoring statistics
      - WebSocket /ws/session: Real-time bidirectional voice & text stream + live responder push

  AI_Engine:
    Model: gemini-3.8-flash
    Capabilities:
      - Audio transcription from voice payloads
      - Psychological stress & trauma scoring (0-100%)
      - Threat level categorization (Low, Moderate, High, Severe)
      - Risk flag detection (Imminent Danger, Caste Harassment, Suicidal Ideation, Panic)
      - Empathetic crisis counseling text generation
      - Voice TTS audio synthesis for caller feedback

  Frontend:
    Interface:
      - Web Portal: Registration, Login, Baseline Questionnaires, Grievance Filing, Self-Help
      - Phone Call Simulator (14566): Interactive live dialer, mic recording, real-time voice response
      - Responder Dashboard: Live Risk Meter (0-100%), High-Risk Emergency Alerts, Transcript, Action Checklist
